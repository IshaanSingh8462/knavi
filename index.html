<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // send_page_view is disabled here on purpose: this SPA has one URL
      // and no router, so a real "navigation" never fires. Virtual page
      // views for each logical screen (Landing, Guest, Account Creation,
      // etc) are sent manually instead — see src/lib/analytics.ts and
      // the tracking effect in App.tsx.
      gtag('config', '%VITE_GA_MEASUREMENT_ID%', { send_page_view: false });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/strail-logo.png" />
    <title>Strail</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
